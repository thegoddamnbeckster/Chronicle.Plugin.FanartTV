name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # The plugin project references ..\Chronicle\src\Chronicle.Plugins, so the host repo sits beside it.
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: thegoddamnbeckster/Chronicle
          path: Chronicle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        shell: pwsh
        run: |
          $tests = Get-ChildItem plugin/tests -Recurse -Filter *.csproj -ErrorAction SilentlyContinue
          if ($tests) {
            foreach ($t in $tests) { dotnet test $t.FullName --nologo; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          } else {
            foreach ($p in Get-ChildItem plugin -Filter *.csproj) { dotnet build $p.FullName --nologo -c Release; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          }
